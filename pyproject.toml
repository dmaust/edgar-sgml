[project]
name = "edgar-sgml"
version = "0.2.0"
description = "A working DTD for the SGML headers of SEC EDGAR filings, and a reader for the documents in its daily archives, tested against real filings"
readme = "README.md"
license = "MIT"
authors = [{ name = "David Maust" }]
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
